<svg width="800" height="180" viewBox="0 0 800 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="puffy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offsetBlur"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="400" y="95"
        font-family="Comic Sans MS, Chalkboard SE, Marker Felt, sans-serif"
        font-size="70"
        font-weight="bold"
        text-anchor="middle"
        fill="none"
        stroke="#0033cc"
        stroke-width="14"
        stroke-linejoin="round"
        transform="rotate(-2 400 95)">
    Welcome to my
  </text>
  <text x="400" y="95"
        font-family="Comic Sans MS, Chalkboard SE, Marker Felt, sans-serif"
        font-size="70"
        font-weight="bold"
        text-anchor="middle"
        fill="#33aaff"
        stroke="#0055ff"
        stroke-width="2"
        transform="rotate(-2 400 95)"
        filter="url(#puffy)">
    Welcome to my
  </text>

  <text x="400" y="165"
        font-family="Comic Sans MS, Chalkboard SE, Marker Felt, sans-serif"
        font-size="70"
        font-weight="bold"
        text-anchor="middle"
        fill="none"
        stroke="#0033cc"
        stroke-width="14"
        stroke-linejoin="round"
        transform="rotate(1 400 165)">
    Github Profile
  </text>
  <text x="400" y="165"
        font-family="Comic Sans MS, Chalkboard SE, Marker Felt, sans-serif"
        font-size="70"
        font-weight="bold"
        text-anchor="middle"
        fill="#33aaff"
        stroke="#0055ff"
        stroke-width="2"
        transform="rotate(1 400 165)"
        filter="url(#puffy)">
    Github Profile
  </text>
</svg>
